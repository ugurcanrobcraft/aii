<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A.U.R.A. - Virtual AI</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --primary-color: #00f3ff;
            --card-bg: #161f30;
            --text-color: #e0e6ed;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 500px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 243, 255, 0.1);
            border: 1px solid rgba(0, 243, 255, 0.2);
            text-align: center;
        }

        h1 { color: var(--primary-color); letter-spacing: 2px; margin-bottom: 5px; }
        .subtitle { font-size: 0.85rem; opacity: 0.7; margin-bottom: 20px; }

        .orb-container {
            margin: 20px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: radial-gradient(circle, #162238 0%, #0b0f19 70%);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.2);
            border: 2px solid rgba(0, 243, 255, 0.3);
            transition: all 0.3s ease;
        }

        canvas { border-radius: 50%; }

        .status { font-weight: bold; color: var(--primary-color); min-height: 24px; margin-bottom: 15px; transition: color 0.3s ease; }
        
        .box { 
            background: #0d1424; 
            border: 1px solid #2a3b5c; 
            border-radius: 8px; 
            padding: 12px; 
            text-align: left; 
            margin-top: 10px; 
            font-size: 0.9rem; 
            max-height: 120px; 
            overflow-y: auto; 
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>A.U.R.A.</h1>
        <div class="subtitle">Sürekli Dinleme Modu</div>

        <div class="orb-container" id="orbContainer" onclick="manualWakeUp()">
            <canvas id="auraCanvas" width="150" height="150"></canvas>
        </div>

        <div class="status" id="statusText">Başlatmak için küreye dokun</div>

        <div class="box"><strong>Siz:</strong> <span id="userText">-</span></div>
        <div class="box"><strong>A.U.R.A.:</strong> <span id="auraText">-</span></div>
    </div>

    <script>
        // --- 1. 3D KÜRE MOTORU VE TEPKİLER ---
        const canvas = document.getElementById('auraCanvas');
        const ctx = canvas.getContext('2d');
        let time = 0;
        let auraState = 'off'; // off, sleeping, listening, thinking, speaking
        let isAwake = false; 

        const particles = [];
        for (let i = 0; i < 150; i++) {
            particles.push({
                theta: Math.random() * Math.PI * 2,
                phi: Math.acos((Math.random() * 2) - 1),
                size: Math.random() * 1.5 + 0.5
            });
        }

        let currentColor = { r: 0, g: 243, b: 255 };

        function animateOrb() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            let targetColor = { r: 0, g: 243, b: 255 };
            let scale = 1;
            let timeSpeed = 0.01;

            if (auraState === 'sleeping' || auraState === 'off') {
                // 🔵 Beklerken: Yavaş dönen sakin mavi parçacıklar
                targetColor = { r: 0, g: 243, b: 255 };
                scale = 1 + Math.sin(time * 2) * 0.02; 
                timeSpeed = 0.01;
            } else if (auraState === 'listening') {
                // 🔴 Dinlerken: Hızlanan ve titreşen kırmızı/pembe
                targetColor = { r: 255, g: 0, b: 85 }; 
                scale = 1.1 + (Math.random() * 0.06); // Titreşim efekti
                timeSpeed = 0.04;
            } else if (auraState === 'thinking') {
                // 🟠 Düşünürken: Dalgalanan turuncu/sarı
                targetColor = { r: 255, g: 170, b: 0 }; 
                scale = 1.05 + Math.sin(time * 5) * 0.08; // Dalgalanma
                timeSpeed = 0.02;
            } else if (auraState === 'speaking') {
                // 🔵 Konuşurken: Ses frekansı gibi hızlı büyüyüp küçülen parlak mavi
                targetColor = { r: 0, g: 150, b: 255 }; 
                scale = 1.15 + Math.sin(time * 18) * 0.15; // Çok hızlı frekans
                timeSpeed = 0.03;
            }

            time += timeSpeed;

            // Renk geçişini yumuşat
            currentColor.r += (targetColor.r - currentColor.r) * 0.1;
            currentColor.g += (targetColor.g - currentColor.g) * 0.1;
            currentColor.b += (targetColor.b - currentColor.b) * 0.1;

            ctx.save();
            ctx.translate(canvas.width / 2, canvas.height / 2);

            particles.forEach(p => {
                let rotationY = time + p.theta;
                let rotationX = time * 0.5;

                let x = Math.sin(p.phi) * Math.cos(rotationY);
                let y = Math.sin(p.phi) * Math.sin(rotationY) * Math.sin(rotationX) + Math.cos(p.phi) * Math.cos(rotationX);
                let z = Math.sin(p.phi) * Math.sin(rotationY) * Math.cos(rotationX) - Math.cos(p.phi) * Math.sin(rotationX);

                let radius = 40 * scale;
                let projectScale = 150 / (150 + z * radius);
                let drawX = x * radius * projectScale;
                let drawY = y * radius * projectScale;

                ctx.beginPath();
                ctx.arc(drawX, drawY, p.size * projectScale, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${currentColor.r}, ${currentColor.g}, ${currentColor.b}, ${Math.max(0.1, z + 0.5)})`;
                ctx.fill();
            });

            ctx.restore();
            requestAnimationFrame(animateOrb);
        }
        animateOrb();

        // --- 2. UYANDIRMA KELİMESİ & MİKROFON SİSTEMİ ---
        let recognition;
        let systemStarted = false;
        
        document.addEventListener("DOMContentLoaded", () => {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (SpeechRecognition) {
                recognition = new SpeechRecognition();
                recognition.lang = 'tr-TR';
                recognition.continuous = true; // Sürekli dinleme açık
                recognition.interimResults = false;

                recognition.onresult = (event) => {
                    const text = event.results[event.results.length - 1][0].transcript.trim();
                    const lowerText = text.toLowerCase();
                    
                    if (!isAwake) {
                        // Sadece uyandırma kelimesini bekliyor
                        if (lowerText.match(/hey\s*(aura|avra|ora|avura|ağra)/i)) {
                            wakeUp(text);
                        }
                    } else {
                        // Sistem uyanık, söylenen her şeyi komut kabul et
                        document.getElementById("userText").innerText = text;
                        askAura(text);
                    }
                };

                // Mikrofonda sessizlik olunca veya kapanınca otomatik tekrar başlat
                recognition.onend = () => {
                    if (auraState !== 'speaking' && systemStarted) {
                        try { recognition.start(); } catch(e) {}
                    }
                };
            } else {
                document.getElementById("statusText").innerText = "Tarayıcınız mikrofon desteklemiyor.";
            }
        });

        // İlk tıklama - Tarayıcı güvenliğini aşmak için gerekli
        function manualWakeUp() {
            if (!systemStarted) {
                systemStarted = true;
                recognition.start();
                goToSleep();
                return;
            }
            // Zaten açıksa, manuel olarak uyandır
            wakeUp();
        }

        function wakeUp(fullText = "") {
            isAwake = true;
            auraState = 'listening';
            updateStatus("Sizi Dinliyor...", "#ff0055");
            
            // Eğer "Hey Aura hava nasıl?" dediyse, cümlenin devamını anında al
            const command = fullText.replace(/hey\s*(aura|avra|ora|avura|ağra)/i, '').trim();
            if (command.length > 2) {
                document.getElementById("userText").innerText = command;
                askAura(command);
            }
        }

        function goToSleep() {
            isAwake = false;
            if(auraState !== 'speaking' && auraState !== 'thinking') {
                auraState = 'sleeping';
                updateStatus("Uyku Modunda ('Hey Aura' deyin)", "var(--primary-color)");
            }
        }

        function updateStatus(text, color) {
            const statusEl = document.getElementById("statusText");
            statusEl.innerText = text;
            statusEl.style.color = color;
            document.getElementById("orbContainer").style.borderColor = color;
        }

        // --- 3. YAPAY ZEKA BAĞLANTISI ---
        async function askAura(promptText) {
            auraState = 'thinking';
            isAwake = false; // Düşünürken ekstra komut alma
            updateStatus("Düşünüyor...", "#ffaa00");

            try {
                const response = await fetch("https://text.pollinations.ai/", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        messages: [
                            { role: "system", content: "Sen A.U.R.A adında karizmatik bir yapay zeka asistanısın. Kısa, samimi ve tek paragraf Türkçe cevaplar ver." },
                            { role: "user", content: promptText }
                        ]
                    })
                });

                if (response.ok) {
                    const reply = await response.text();
                    document.getElementById("auraText").innerText = reply;
                    speak(reply);
                } else {
                    throw new Error("API Hatası");
                }
            } catch (error) {
                document.getElementById("auraText").innerText = "Bağlantı hatası oluştu.";
                goToSleep();
            }
        }

        // --- 4. SESLİ OKUMA ---
        function speak(text) {
            auraState = 'speaking';
            updateStatus("Konuşuyor...", "#0096ff");
            
            // Kendi sesini duyup döngüye girmemesi için dinlemeyi durdur
            recognition.stop(); 
            window.speechSynthesis.cancel(); 

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'tr-TR';
            utterance.rate = 1.0;
            
            utterance.onend = () => {
                goToSleep();
                try { recognition.start(); } catch(e) {} // Konuşma bitince dinlemeyi geri aç
            };
            
            utterance.onerror = () => {
                goToSleep();
                try { recognition.start(); } catch(e) {}
            };

            window.speechSynthesis.speak(utterance);
        }
    </script>
</body>
</html>
