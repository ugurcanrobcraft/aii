<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A.U.R.A. - 3D Virtual Assistant</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --primary-color: #00f3ff;
            --card-bg: #161f30;
            --text-color: #e0e6ed;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 500px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 243, 255, 0.1);
            border: 1px solid rgba(0, 243, 255, 0.2);
            text-align: center;
        }

        h1 {
            color: var(--primary-color);
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        .subtitle {
            font-size: 0.85rem;
            opacity: 0.7;
            margin-bottom: 20px;
        }

        .api-input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid #2a3b5c;
            background: #0d1424;
            color: #fff;
            box-sizing: border-box;
        }

        .orb-container {
            margin: 20px 0;
            display: flex;
            justify-content: center;
            cursor: pointer;
        }

        canvas {
            filter: drop-shadow(0 0 15px rgba(0, 243, 255, 0.5));
            transition: filter 0.3s ease;
        }

        .status {
            font-weight: bold;
            color: var(--primary-color);
            min-height: 24px;
            margin-bottom: 15px;
            transition: color 0.3s ease;
        }

        .box {
            background: #0d1424;
            border: 1px solid #2a3b5c;
            border-radius: 8px;
            padding: 12px;
            text-align: left;
            margin-top: 10px;
            font-size: 0.9rem;
            max-height: 120px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>A.U.R.A.</h1>
    <div class="subtitle">Automated Universal Response Assistant</div>

    <input type="password" id="apiKey" class="api-input" placeholder="Groq API Key Girin (gsk_...)" onchange="saveKey()">

    <div class="orb-container" onclick="toggleListening()">
        <canvas id="auraCanvas" width="160" height="160"></canvas>
    </div>

    <div class="status" id="statusText">Başlamak için küreye tıklayın</div>

    <div class="box"><strong>Siz:</strong> <span id="userText">-</span></div>
    <div class="box"><strong>A.U.R.A.:</strong> <span id="auraText">-</span></div>
</div>

<script>
    // --- 3D KÜRE (CANVAS) MOTORU ---
    const canvas = document.getElementById('auraCanvas');
    const ctx = canvas.getContext('2d');
    let width = canvas.width;
    let height = canvas.height;
    let time = 0;
    
    // Küre Durumları: 'idle' (Bekleme), 'listening' (Dinleme), 'thinking' (Düşünme), 'speaking' (Konuşma)
    let auraState = 'idle'; 

    // 3D Parçacıklar
    const particles = [];
    const numParticles = 200;
    for (let i = 0; i < numParticles; i++) {
        particles.push({
            theta: Math.random() * Math.PI * 2,
            phi: Math.acos((Math.random() * 2) - 1),
            size: Math.random() * 1.5 + 0.5
        });
    }

    // Renk Geçişleri İçin Değişkenler
    let currentColor = { r: 0, g: 243, b: 255 };

    function lerpColor(current, target, speed = 0.05) {
        current.r += (target.r - current.r) * speed;
        current.g += (target.g - current.g) * speed;
        current.b += (target.b - current.b) * speed;
    }

    function animateOrb() {
        ctx.clearRect(0, 0, width, height);
        time += 0.02;

        let targetColor = { r: 0, g: 243, b: 255 }; // Mavi (Idle)
        let scale = 1;
        let speedMultiplier = 1;

        if (auraState === 'listening') {
            targetColor = { r: 255, g: 0, b: 85 }; // Kırmızı/Pembe
            scale = 1.1 + Math.sin(time * 8) * 0.1; 
            speedMultiplier = 2.5;
            canvas.style.filter = "drop-shadow(0 0 25px rgba(255, 0, 85, 0.8))";
            document.getElementById('statusText').style.color = "#ff0055";
        } else if (auraState === 'thinking') {
            targetColor = { r: 255, g: 170, b: 0 }; // Turuncu
            scale = 1.0 + Math.sin(time * 3) * 0.05;
            speedMultiplier = 1.5;
            canvas.style.filter = "drop-shadow(0 0 20px rgba(255, 170, 0, 0.6))";
            document.getElementById('statusText').style.color = "#ffaa00";
        } else if (auraState === 'speaking') {
            targetColor = { r: 0, g: 255, b: 150 }; // Parlak Camgöbeği/Yeşil
            scale = 1.15 + Math.sin(time * 12) * 0.15; // Hızlı Titreşim (Ses dalgası gibi)
            speedMultiplier = 2;
            canvas.style.filter = "drop-shadow(0 0 30px rgba(0, 255, 150, 0.8))";
            document.getElementById('statusText').style.color = "#00ff96";
        } else {
            // Idle
            canvas.style.filter = "drop-shadow(0 0 15px rgba(0, 243, 255, 0.5))";
            document.getElementById('statusText').style.color = "var(--primary-color)";
        }

        lerpColor(currentColor, targetColor);

        ctx.save();
        ctx.translate(width / 2, height / 2);

        // Parçacıkları Çiz
        particles.forEach(p => {
            let rotationY = time * speedMultiplier + p.theta;
            let rotationX = (time * 0.5) * speedMultiplier;

            let x = Math.sin(p.phi) * Math.cos(rotationY);
            let y = Math.sin(p.phi) * Math.sin(rotationY) * Math.sin(rotationX) + Math.cos(p.phi) * Math.cos(rotationX);
            let z = Math.sin(p.phi) * Math.sin(rotationY) * Math.cos(rotationX) - Math.cos(p.phi) * Math.sin(rotationX);

            let radius = 45 * scale; 
            let projectScale = 150 / (150 + z * radius);
            
            let drawX = x * radius * projectScale;
            let drawY = y * radius * projectScale;

            let opacity = Math.max(0.1, z + 0.5);

            ctx.beginPath();
            ctx.arc(drawX, drawY, p.size * projectScale, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${Math.floor(currentColor.r)}, ${Math.floor(currentColor.g)}, ${Math.floor(currentColor.b)}, ${opacity})`;
            ctx.fill();
        });

        ctx.restore();
        requestAnimationFrame(animateOrb);
    }

    animateOrb(); // 3D Animasyonu Başlat

    // --- SESLİ ASİSTAN MANTIĞI ---
    let isListening = false;
    let recognition;

    document.addEventListener("DOMContentLoaded", () => {
        const savedKey = localStorage.getItem("groq_api_key");
        if (savedKey) document.getElementById("apiKey").value = savedKey;

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'tr-TR';
            recognition.continuous = false;

            recognition.onstart = () => {
                auraState = 'listening';
                setStatus("A.U.R.A. sizi dinliyor...");
            };

            recognition.onresult = (event) => {
                const text = event.results[0][0].transcript;
                document.getElementById("userText").innerText = text;
                askAura(text);
            };

            recognition.onerror = (e) => {
                setStatus("Hata oluştu: " + e.error);
                stopListening();
            };

            recognition.onend = () => {
                if (auraState === 'listening') stopListening();
            };
        } else {
            setStatus("Tarayıcınız ses tanımayı desteklemiyor.");
        }
    });

    function saveKey() {
        const key = document.getElementById("apiKey").value.trim();
        localStorage.setItem("groq_api_key", key);
    }

    function toggleListening() {
        if (!isListening) {
            const key = document.getElementById("apiKey").value.trim();
            if (!key) {
                alert("Lütfen önce Groq API anahtarınızı girin!");
                return;
            }
            window.speechSynthesis.cancel(); 
            recognition.start();
            isListening = true;
        } else {
            recognition.stop();
            stopListening();
        }
    }

    function stopListening() {
        isListening = false;
        if (auraState !== 'speaking' && auraState !== 'thinking') {
            auraState = 'idle';
            setStatus("Başlamak için küreye tıklayın");
        }
    }

    function setStatus(text) {
        document.getElementById("statusText").innerText = text;
    }

    // Groq API İsteği (Gelişmiş Hata Ayıklama ile)
    async function askAura(promptText) {
        auraState = 'thinking';
        setStatus("A.U.R.A. düşünüyor...");
        const apiKey = localStorage.getItem("groq_api_key");

        try {
            const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${apiKey}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    model="llama-3.1-8b-instant",
                    messages: [
                        {
                            role: "system",
                            content: "Sen A.U.R.A. adında karizmatik, bilgili ve yardımsever bir yapay zeka asistansın. Yanıtlarını sesli okunacağı için net, doğal, anlaşılır ve kısa tut."
                        },
                        { role: "user", content: promptText }
                    ]
                })
            });

            const data = await response.json();
            
            if (!response.ok) {
                const errorMsg = data.error?.message || "Bilinmeyen API Hatası";
                auraState = 'idle';
                setStatus("HATA: " + errorMsg);
                document.getElementById("auraText").innerText = "Sistem Hatası: " + errorMsg;
                console.error("Groq Detaylı Hata:", data);
                return;
            }

            if (data.choices && data.choices[0]) {
                const reply = data.choices[0].message.content;
                document.getElementById("auraText").innerText = reply;
                speak(reply);
            } else {
                auraState = 'idle';
                setStatus("Geçersiz API Yanıtı Geldi");
            }
        } catch (error) {
            auraState = 'idle';
            setStatus("İnternet veya Bağlantı Hatası");
            document.getElementById("auraText").innerText = error.message;
            console.error(error);
        }
    }

    // EKSİK OLAN KONUŞMA FONKSİYONU EKLENDİ
    function speak(text) {
        auraState = 'speaking';
        setStatus("A.U.R.A. konuşuyor...");
        window.speechSynthesis.cancel(); 
        
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'tr-TR';
        utterance.rate = 1.0;
        
        utterance.onend = () => {
            auraState = 'idle';
            setStatus("Başlamak için küreye tıklayın");
        };

        utterance.onerror = () => {
            auraState = 'idle';
            setStatus("Başlamak için küreye tıklayın");
        };

        window.speechSynthesis.speak(utterance);
    }
        canvas {
        background: radial-gradient(circle, #162238 0%, #0b0f19 70%);
        border: 2px solid rgba(0, 243, 255, 0.3);
        border-radius: 50%;
        box-shadow: 0 0 20px rgba(0, 243, 255, 0.2);
        filter: drop-shadow(0 0 15px rgba(0, 243, 255, 0.5));
        transition: filter 0.3s ease;
        }
    
</script>

</body>
</html>
